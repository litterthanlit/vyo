<style>
/*FONTS*/
/* Layout: a gallery wall. Five 16:10 sheets, one per project, stacked with room to breathe; each sheet keeps its own paper. */
:root {
  --wall: #E6E6E3; --wall-ink: #1A1A19; --wall-soft: #6E6E69;
  --display: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: Newsreader, "Iowan Old Style", Georgia, serif;
  --mono: "Commit", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wall: #121212; --wall-ink: #ECECE8; --wall-soft: #8B8B86; color-scheme: dark } }
:root[data-theme="dark"] { --wall: #121212; --wall-ink: #ECECE8; --wall-soft: #8B8B86; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--wall); color: var(--wall-ink); font-family: var(--mono); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 48px 72px }
.wall { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px }
.intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px 32px }
.intro h1 { margin: 0; font: 800 clamp(28px, 4vw, 44px)/1 var(--display); letter-spacing: -0.03em }
.intro p { margin: 0; max-width: 46ch; font-size: 13px; line-height: 20px; color: var(--wall-soft) }
.frame { width: 100%; max-width: 100%; aspect-ratio: 16 / 10; position: relative; overflow: hidden; container-type: inline-size }
.sheet { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; transform: scale(calc(100cqw / 1600px)); overflow: hidden; background: var(--p); color: var(--i) }
.sheet canvas { position: absolute; left: 0; top: 196px; width: 1600px; height: 560px; touch-action: pan-y }
.name { position: absolute; left: 64px; top: 44px; margin: 0; font: 800 112px/1 var(--display); letter-spacing: -0.045em; white-space: nowrap }
.name i { font-style: normal; color: var(--a) }
.meta { position: absolute; left: 70px; top: 166px; font-size: 13px; letter-spacing: .04em; color: var(--s) }
.tag { position: absolute; right: 64px; top: 64px; width: 440px; margin: 0; font: 400 34px/42px var(--serif); letter-spacing: -0.01em; color: var(--s2, var(--s)) }
.band { position: absolute; left: 64px; right: 64px; top: 786px; border-top: 1px solid var(--rule); padding-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px }
.band p { margin: 0; font-size: 13px; line-height: 20px; color: var(--s) }
.band b { display: block; color: var(--i); font-weight: 700 }
.band span { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; color: var(--s) }
.foot { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between; font-size: 12px; color: var(--s) }
.foot em { font-style: normal; color: var(--i) }
.toggle { font: 12px var(--mono); color: var(--wall-ink); background: transparent; border: 1px solid var(--wall-ink); border-radius: 999px; padding: 6px 14px; cursor: pointer }
.toggle:focus-visible { outline: 2px solid var(--wall-ink); outline-offset: 2px }
figcaption { margin-top: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--wall-soft) }
figure { margin: 0 }
</style>

<main class="wall">
  <header class="intro">
    <h1>litt.design, the work.</h1>
    <p>Five projects, five posters. Each picture is made from the project's own words and acts out what it does. Point at a picture to play with it.</p>
    <button class="toggle" id="motion" aria-pressed="true">Hold still</button>
  </header>
  <div id="posters"></div>
</main>

<script>
const P = [
  { id: "hypher", name: "Hypher", tag: "Switch coding agents without starting over.", meta: "PRODUCT · 2026 · IN PROGRESS", url: "hypher.app", stack: "Next.js · Convex · TypeScript · MCP",
    theme: { p: "#EAE8E2", i: "#161616", s: "#6B6962", a: "#FF4F12", rule: "#161616" },
    cols: [["Challenge", "Every new agent starts cold", "The code lives in the repo. The decisions don't."], ["Approach", "Dump, one note, writeback", "Messy input becomes one bounded note per project."], ["Execution", "Handoff that checks itself", "Checkpoints are verified against the working tree on resume."], ["Result", "The next session starts warm", "Open another agent and it already knows the next action."]] },
  { id: "wavr", name: "Wavr", tag: "Shader code, turned into motion you can export.", meta: "CREATIVE TOOL · 2026", url: "wavr-v1.vercel.app", stack: "Next.js · WebGL 2 · GLSL · Zustand",

    cols: [["Challenge", "Gradient tools are static", "Designers want living gradients without writing shaders."], ["Approach", "Visual controls over raw GLSL", "Every uniform gets a slider. The interface hides the math."], ["Execution", "Single-shader architecture", "One fragment shader. Switching modes only swaps uniforms."], ["Result", "Export-ready motion", "CSS, PNG or WebM in seconds. The mouse moves it, here too."]] },
  { id: "studio", name: "Studio OS", tag: "A design tool built around taste. References in, shipped UI out.", meta: "DESIGN TOOL · 2025–2026", url: "studio-os.io", stack: "Next.js · TypeScript · Tailwind · AI agents",
    theme: { p: "#0C0E1A", i: "#EEF0F8", s: "#7C8299", a: "#6E7BFF", rule: "#2E3350" },
    cols: [["Challenge", "AI output has no taste", "The references that shape your eye never reach the prompt."], ["Approach", "References in, directives out", "A moodboard compiles into type, spacing and colour rules."], ["Execution", "A canvas that respects structure", "Real, editable layout. Copy clean HTML or publish."], ["Result", "Taste you can reuse", "Every screen looks like one designer with one point of view."]] },
  { id: "vyo", name: "Vyo", tag: "Turns a codebase into posters that explain the app to anyone.", meta: "AGENT SKILL · 2026 · IN PROGRESS", url: "github.com/litterthanlit/vyo", stack: "Cursor Skills · React · Playwright · esbuild",
    theme: { p: "#FFFFFF", i: "#0A0A0A", s: "#5B6066", a: "#E4002B", rule: "#0A0A0A" },
    cols: [["Challenge", "Code explains itself only to coders", "Clients and founders live with an app they can't read."], ["Approach", "A poster, not a document", "The scan lays the repo out on a real 12-column grid."], ["Execution", "Rules a machine can check", "Off-grid lines and low contrast fail before anything ships."], ["Result", "A shared picture of the app", "One sheet a non-engineer reads in a minute."]] },
  { id: "littmd", name: "litt.md", tag: "A design language an agent can install, follow and be checked against.", meta: "DESIGN SYSTEM · 2026", url: "littmd.vercel.app", stack: "Claude Code · React · Tailwind CSS · shadcn",
    theme: { p: "#0E0E0E", i: "#F1F0EC", s: "#8A8984", a: "#FFD21F", rule: "#3A3A38" },
    cols: [["Challenge", "Agents build in everyone's voice", "Purple gradients, three icon cards, a bounce on everything."], ["Approach", "Taste, written down as rules", "Nine rules, one token file, one taste journal."], ["Execution", "Components it can't get wrong", "Lints fail on a stray hex value or an off-scale radius."], ["Result", "One voice across every project", "Any app gets a score out of 100, with every fix listed."]] },
];

const W = 1600, H = 560, MONO = '"Commit", ui-monospace, Menlo, monospace', DISPLAY = '"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif', SERIF = 'Newsreader, Georgia, serif';
const rnd = (seed) => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(",")})`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

// ───────────── Hypher: every line of the mess pinches into one tight orange knot, the note, then loosens into the next agent.
const HY_TAPES = {
  mess: "RANTS   SCREENSHOTS   CHAT EXPORTS   HALF A THOUGHT   TODOS   DON'T DO X   WHY WE CHOSE IT   USAGE LIMIT HIT   ANOTHER RANT   ",
  note: "DECISIONS · THE GOAL · NEXT STEP · ",
  out: "CLAUDE CODE   CODEX   CURSOR   THE NEXT AGENT   STARTS WARM   KNOWS THE GOAL   ",
};
function hypher(g, t, ptr, th) {
  const N = 38, cx = W / 2, cy = H / 2 - 6, span = (H - 70) / 2, half = W / 2 - 64, ADV = 8.4;
  const soft = hex(th.s), ink = hex(th.i), paper = hex(th.p);
  const pinch = (x) => {
    let s = 0.05 + 0.95 * Math.pow(clamp(Math.abs(x - cx) / half), 1.8);
    if (ptr.on) s += (1 - s) * 0.8 * Math.exp(-((x - ptr.x) ** 2) / (2 * 120 * 120));
    return s;
  };
  const slots = Math.floor((W - 128) / ADV);
  const ps = [], xs = [];
  for (let j = 0; j <= slots; j++) { xs.push(64 + j * ADV); ps.push(pinch(64 + j * ADV)); }
  g.textBaseline = "middle"; g.textAlign = "center";
  let font = "";
  for (let r = 0; r < N; r++) {
    const d = (r - (N - 1) / 2) / ((N - 1) / 2), p = t * 38 + r * 97, base = Math.floor(p / ADV), frac = p % ADV;
    for (let j = 0; j <= slots; j++) {
      const x = xs[j] - frac;
      if (x < 64 || x > W - 64) continue;
      const u = Math.abs(x - cx) / half, s = ps[j];
      const zone = u < 0.13 ? "note" : x < cx ? "mess" : "out", tape = HY_TAPES[zone];
      const ch = tape[(j + base + r * 13) % tape.length];
      if (ch === " ") continue;
      const wob = zone === "mess" ? Math.sin(t * 1.2 + x * 0.018 + r) * 3 * s : 0;
      const y = cy + d * span * s + wob;
      const size = Math.round(6 + 6 * Math.min(1, s * 1.4));
      const f = `${zone === "note" ? 700 : 400} ${size}px ${MONO}`;
      if (f !== font) { g.font = f; font = f; }
      if (zone === "note") { g.globalAlpha = 0.85; g.fillStyle = th.a; }
      else if (zone === "mess") { g.globalAlpha = 1; g.fillStyle = mix(paper, soft, clamp(0.35 + (1 - u) * 0.9)); }
      else { g.globalAlpha = 1; g.fillStyle = mix(soft, ink, clamp(1.4 - u)); }
      g.fillText(ch, x, y);
    }
  }
  g.globalAlpha = 1; g.textAlign = "center";
  g.fillStyle = th.a; g.font = `700 13px ${MONO}`;
  g.fillText("ONE NOTE", cx, cy + 62);
  g.fillStyle = th.s; g.font = `400 11px ${MONO}`;
  g.fillText("the goal, the decisions, the next action", cx, cy + 82);
  g.textAlign = "left"; g.fillStyle = th.s; g.font = `400 12px ${MONO}`;
  g.fillText("WHAT YOU DUMP IN", 64, 10);
  g.textAlign = "right"; g.fillStyle = th.i;
  g.fillText("WHAT THE NEXT AGENT READS", W - 64, 10);
  g.textAlign = "left";
}

// ───────────── Wavr: a living mesh gradient drawn in type. Each glyph is a uniform name; the pointer bends the field.
const WAVR_TEXT = "speed complexity distortion bloom noise grain particles warp hue ";
const WAVR_STOPS = ["#0A0D18", "#22306B", "#3F7CFF", "#2FD6C3", "#FFC65A", "#FF7A45", "#FF3D6E"].map(hex);
const wavrColor = (v) => { v = clamp(v) * (WAVR_STOPS.length - 1); const i = Math.min(WAVR_STOPS.length - 2, Math.floor(v)); return mix(WAVR_STOPS[i], WAVR_STOPS[i + 1], v - i); };
function wavr(g, t, ptr, th) {
  const CW = 10, CH = 15, cols = Math.floor((W - 128) / CW), rows = Math.floor((H - 44) / CH);
  g.font = `400 12px ${MONO}`; g.textBaseline = "top";
  let k = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++, k++) {
      let x = c / cols, y = r / rows;
      const px = 64 + c * CW, py = r * CH;
      if (ptr.on) {
        const dx = px - ptr.x, dy = py - ptr.y, dist = Math.hypot(dx, dy), f = Math.exp(-(dist * dist) / 18000);
        x += f * 0.06 * Math.sin(t * 2 + dist * 0.03); y += f * 0.06 * Math.cos(t * 2 + dist * 0.03);
      }
      const wx = x + 0.18 * Math.sin(y * 4.1 + t * 0.35), wy = y + 0.22 * Math.sin(x * 3.3 - t * 0.28);
      const v = 0.5 + 0.22 * Math.sin(wx * 5.2 + t * 0.5) + 0.2 * Math.sin(wy * 6.7 - t * 0.42) + 0.16 * Math.sin((wx + wy) * 7.5 + t * 0.6);
      const edge = Math.min(1, x * 8, (1 - x) * 8, y * 6 + 0.2, (1 - y) * 6 + 0.2);
      const b = clamp((v - 0.12) / 0.78) * clamp(edge);
      if (b < 0.1) continue;
      g.globalAlpha = clamp(0.35 + b);
      g.fillStyle = wavrColor(b);
      g.fillText(WAVR_TEXT[k % WAVR_TEXT.length], px, py);
    }
  }
  g.globalAlpha = 1;
  g.fillStyle = th.i; g.font = `400 12px ${MONO}`; g.textBaseline = "middle";
  g.fillText("uniform float uSpeed = 0.35;   uniform float uComplexity = 5.2;   uniform float uDistortion = 0.22;", 64, H - 14);
  g.textAlign = "right"; g.fillStyle = th.s;
  g.fillText("EXPORT  CSS · PNG · WEBM", W - 64, H - 14);
  g.textAlign = "left";
}

// ───────────── Studio OS: references fall from chaos on the left into a strict 12-column layout on the right. The pointer applies taste.
const SO_WORDS = ["editorial serif", "swiss grid", "moodboard.png", "type specimen", "screenshot_0412", "8 / 16 / 32", "tight rhythm", "line length 65", "no neon", "density", "#14151A", "serif display", "12 columns", "24 gutter", "PROTECT", "SEND", "AVOID", "gradients", "shadows", "generous margins", "one accent", "flush left", "baseline 8", "hierarchy", "PROTECT", "AVOID", "white space", "real content"];
const studioItems = (() => {
  const r = rnd(23), items = [], COLW = (W - 128 - 11 * 16) / 12, LH = 22, rows = Math.floor((H - 50) / LH);
  for (let row = 0; row < rows; row++) {
    if (row >= 2 && row <= 6) continue; // room for the display line
    let col = 0;
    while (col < 12) {
      const span = 1 + Math.floor(r() * 3), w = SO_WORDS[Math.floor(r() * SO_WORDS.length)];
      if (col + span > 12) break;
      if (r() < 0.82) items.push({ w, tx: 64 + col * (COLW + 16), ty: 34 + row * LH, size: 12, serif: false, cx: 40 + r() * (W - 80), cy: 30 + r() * (H - 60), a: (r() - 0.5) * 1.2, sc: 0.7 + r() * 1.1, ph: r() * 6, k: 0 });
      col += span;
    }
  }
  ["Taste", "you can", "reuse."].forEach((w, i) => items.push({ w, tx: 64 + [6, 8, 10][i] * (COLW + 16) - (i ? 40 : 0), ty: 112, size: 64, serif: true, cx: 60 + r() * 500, cy: 60 + r() * 400, a: (r() - 0.5) * 0.9, sc: 0.6, ph: r() * 6, k: 0 }));
  return { items, COLW };
})();
const smooth = (a, b, x) => { const v = clamp((x - a) / (b - a)); return v * v * (3 - 2 * v); };
function studio(g, t, ptr, th) {
  const soft = hex(th.s), ink = hex(th.i), { items, COLW } = studioItems;
  const guide = g.createLinearGradient(64, 0, W - 64, 0);
  guide.addColorStop(0, "rgba(110,123,255,0)"); guide.addColorStop(0.55, "rgba(110,123,255,0.05)"); guide.addColorStop(1, "rgba(110,123,255,0.11)");
  g.fillStyle = guide;
  for (let i = 0; i < 12; i++) g.fillRect(64 + i * (COLW + 16), 20, COLW, H - 56);
  g.textBaseline = "middle";
  for (const it of items) {
    let o = smooth(0.12, 0.78, it.tx / W);
    const dx = it.cx + Math.sin(t * 0.5 + it.ph) * 14, dy = it.cy + Math.cos(t * 0.4 + it.ph) * 10;
    const curX = dx + (it.tx - dx) * o, curY = dy + (it.ty - dy) * o;
    const brush = ptr.on ? clamp(1 - Math.hypot(ptr.x - curX, ptr.y - curY) / 170) : 0;
    it.k += (brush - it.k) * (t === 0 ? 1 : 0.08);
    o = clamp(o + it.k);
    const x = dx + (it.tx - dx) * o, y = dy + (it.ty - dy) * o, sc = it.sc + (1 - it.sc) * o;
    g.save(); g.translate(x, y); g.rotate(it.a * (1 - o)); g.scale(sc, sc);
    const key = it.w === "PROTECT" ? "#6E7BFF" : it.w === "AVOID" || it.w === "gradients" || it.w === "shadows" ? "#FF5A4E" : null;
    g.font = it.serif ? `400 ${it.size}px ${SERIF}` : `${key && o > 0.6 ? 700 : 400} ${it.size}px ${MONO}`;
    g.fillStyle = key && o > 0.6 ? key : mix(soft, ink, 0.15 + o * 0.85);
    g.globalAlpha = 0.45 + o * 0.55;
    g.fillText(it.w, 0, 0);
    if ((it.w === "gradients" || it.w === "shadows") && o > 0.6) { g.fillRect(0, 0, g.measureText(it.w).width, 1.5); }
    g.restore();
  }
  g.globalAlpha = 1; g.fillStyle = th.s; g.font = `400 12px ${MONO}`;
  g.fillText("REFERENCES IN", 64, 10);
  g.textAlign = "right"; g.fillStyle = th.i; g.fillText("SHIPPED ON A 12-COLUMN GRID", W - 64, 10); g.textAlign = "left";
}

// ───────────── Vyo: a field of the skill's own source code. The glyphs that land on the poster turn to ink; point to peel it back.
let vyoMask = null;
function vyo(g, t, ptr, th) {
  const CW = 6, CH = 9, cols = Math.floor((W - 128) / CW), rows = Math.floor((H - 34) / CH);
  if (!vyoMask) {
    const m = document.createElement("canvas"); m.width = W; m.height = H;
    const mg = m.getContext("2d"); mg.fillStyle = "#000";
    mg.fillRect(64, 26, W - 128, 7);
    mg.font = `800 236px ${DISPLAY}`; mg.textBaseline = "alphabetic"; mg.fillText("Recipe", 56, 290);
    const vw = mg.measureText("Recipe").width; mg.fillStyle = "#F00"; mg.beginPath(); mg.arc(56 + vw + 34, 262, 30, 0, Math.PI * 2); mg.fill();
    mg.fillStyle = "#000"; mg.font = `800 150px ${DISPLAY}`;
    mg.font = `800 130px ${DISPLAY}`;
    ["1", "2", "3"].forEach((n, i) => mg.fillText(n, 1150 + i * 135, 190));
    mg.fillRect(1150, 222, W - 1214, 3);
    [0, 1, 2].forEach((i) => mg.fillRect(1150 + i * 135, 246, 96 - i * 14, 8));
    mg.fillRect(64, 427, W - 128, 6);
    [0, 1, 2, 3, 4, 5].forEach((i) => { mg.beginPath(); mg.arc(84 + i * (W - 168) / 5, 430, 24, 0, Math.PI * 2); mg.fill(); });
    const d = mg.getImageData(0, 0, W, H).data;
    vyoMask = (x, y) => { const i = (Math.floor(y) * W + Math.floor(x)) * 4; return d[i + 3] < 128 ? 0 : d[i] > 200 && d[i + 1] < 80 ? 2 : 1; };
  }
  const shift = Math.floor(t * 24), passes = [[], [], [], []];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = 64 + c * CW, y = 24 + r * CH, k = (r * cols + c + shift) % VYO_CODE.length;
    const lens = ptr.on && Math.hypot(x - ptr.x, y - ptr.y) < 120, m = lens ? 3 : vyoMask(x + 3, y + 4);
    const ch = m === 1 || m === 2 ? VYO_DENSE[k % VYO_DENSE.length] : VYO_CODE[k];
    if (ch === " " && m !== 1 && m !== 2) continue;
    passes[m].push(ch, x, y);
  }
  g.textBaseline = "middle";
  // Inside the poster each cell is a solid square with its code glyph knocked out in white, so the letters read as shapes.
  [[1, th.i], [2, th.a]].forEach(([p, col]) => { g.fillStyle = col; const l = passes[p]; for (let i = 0; i < l.length; i += 3) g.fillRect(l[i + 1] - 0.5, l[i + 2] - CH / 2, CW + 1, CH + 0.5); });
  const style = [["400 9px", "#E4E5E8"], ["700 8px", "#FFFFFF"], ["700 8px", "#FFFFFF"], ["400 9px", "#7D838A"]];
  passes.forEach((list, p) => { g.font = `${style[p][0]} ${MONO}`; g.fillStyle = style[p][1]; for (let i = 0; i < list.length; i += 3) g.fillText(list[i], list[i + 1], list[i + 2]); });
  g.fillStyle = th.s; g.font = `400 12px ${MONO}`; g.fillText("Every glyph is a character of Vyo's own scanner, tools/scan.mjs", 64, H - 10);
}

// ───────────── litt.md: a field of style declarations. Off-brand values glow purple; the lint sweeps across and sets them in the language.
const littRows = (() => {
  const r = rnd(5), ok = ["padding: var(--space-4)", "gap: var(--space-2)", "radius: var(--radius-2)", "color: var(--ink)", "background: var(--paper)", "font: var(--type-16)", "border: var(--rule)", "max-width: var(--measure-65)", "margin: var(--space-8)", "accent: var(--accent)", "grid: var(--grid-12)", "font: var(--type-48)"];
  const bad = [["color: #7C3AED", "color: var(--accent)"], ["radius: 13px", "radius: var(--radius-2)"], ["shadow: 2xl", "shadow: none"], ["animate: bounce", "animate: none"], ["font: Inter", "font: var(--type-16)"], ["bg: linear-gradient(purple)", "background: var(--paper)"], ["padding: 17px", "padding: var(--space-4)"], ["blur: 24px", "blur: none"]];
  const rows = [];
  for (let y = 22; y < H - 30; y += 15) {
    const row = []; let x = 64 + (r() * 60 | 0);
    while (x < W - 120) {
      const isBad = r() < 0.15, pair = bad[Math.floor(r() * bad.length)], text = isBad ? pair[0] : ok[Math.floor(r() * ok.length)];
      row.push({ x, y, text: text + ";", good: isBad ? pair[1] + ";" : null, fixed: 0 });
      x += (Math.max(text.length, isBad ? pair[1].length : 0) + 3) * 6.6;
    }
    rows.push(row);
  }
  return rows;
})();
function littmd(g, t, ptr, th) {
  const cycle = ((t / 8) + 0.62) % 1, scanX = 64 + cycle * (W - 128);
  let bad = 0, total = 0;
  g.textBaseline = "middle"; g.font = `400 11px ${MONO}`;
  for (const row of littRows) for (const d of row) {
    if (d.good) {
      total++;
      if (ptr.on && Math.hypot(d.x + 40 - ptr.x, d.y - ptr.y) < 110) d.fixed = 1;
      const fixed = d.x < scanX || d.fixed;
      if (!fixed) bad++;
      if (cycle < 0.01) d.fixed = 0;
      g.font = `700 11px ${MONO}`; g.fillStyle = fixed ? th.a : "#A26BFF";
      g.fillText(fixed ? d.good : d.text, d.x, d.y); g.font = `400 11px ${MONO}`;
    } else {
      g.fillStyle = d.x < scanX ? "#55544F" : "#3A3A37";
      g.fillText(d.text, d.x, d.y);
    }
  }
  const glow = g.createLinearGradient(scanX - 60, 0, scanX, 0);
  glow.addColorStop(0, "rgba(255,210,31,0)"); glow.addColorStop(1, "rgba(255,210,31,0.16)");
  g.fillStyle = glow; g.fillRect(scanX - 60, 14, 60, H - 40);
  g.fillStyle = th.a; g.fillRect(scanX, 14, 2, H - 40);
  const score = Math.round(100 - (bad / Math.max(1, total)) * 52);
  g.fillStyle = th.p; g.fillRect(W - 64 - 300, H - 170, 300, 150);
  g.fillStyle = th.a; g.font = `800 120px ${DISPLAY}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
  g.fillText(String(score), W - 64 - 70, H - 46);
  g.font = `400 14px ${MONO}`; g.fillStyle = th.s; g.fillText("/100", W - 64, H - 50);
  g.fillText("SCORE", W - 64, H - 150);
  g.textAlign = "left"; g.textBaseline = "middle"; g.font = `400 12px ${MONO}`; g.fillStyle = th.s;
  g.fillText("EVERYONE'S VOICE, IN PURPLE  →  ONE VOICE, IN TOKENS", 64, 8);
}

const VYO_CODE = /*CODE*/"";
const VYO_DENSE = VYO_CODE.replace(/\s+/g, "");

const DRAW = { hypher, wavr, studio, vyo, littmd };

// ───────────── the gallery
const host = document.getElementById("posters");
const live = { on: !matchMedia("(prefers-reduced-motion: reduce)").matches };
const sheets = P.map((p, n) => {
  const fig = document.createElement("figure");
  const style = Object.entries(p.theme).map(([k, v]) => `--${k}:${v}`).join(";");
  const dot = p.name.endsWith(".md") ? "" : "<i>.</i>";
  fig.innerHTML = `<div class="frame"><section class="sheet" style="${style}" aria-labelledby="t-${p.id}">
    <h2 class="name" id="t-${p.id}">${p.name}${dot}</h2>
    <div class="meta">${p.meta}</div>
    <p class="tag">${p.tag}</p>
    <canvas width="${W}" height="${H}" role="img" aria-label="${p.name} poster picture"></canvas>
    <div class="band">${p.cols.map(([l, h, s]) => `<p><span>${l}</span><b>${h}</b>${s}</p>`).join("")}</div>
    <div class="foot"><span>litt.design &nbsp;/&nbsp; Work ${String(n + 1).padStart(2, "0")} of ${String(P.length).padStart(2, "0")}</span><span>${p.stack}</span><em>${p.url}</em></div>
  </section></div><figcaption><span>${p.name}</span><span>${["Point anywhere to loosen the knot", "Point at the field to bend it", "Point at the chaos to apply taste", "Point at the poster to peel it back to code", "Point at the purple to lint it"][n]}</span></figcaption>`;
  host.appendChild(fig);
  if (n < P.length - 1) host.appendChild(Object.assign(document.createElement("div"), { style: "height:56px" }));
  const cv = fig.querySelector("canvas"), g = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  const s = { p, cv, g, ptr: { x: 0, y: 0, on: false }, visible: true, dirty: true };
  const fit = () => { const w = Math.max(1, Math.round(cv.getBoundingClientRect().width * dpr)); if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * H / W); } s.dirty = true; };
  fit(); addEventListener("resize", fit);
  cv.addEventListener("pointermove", (e) => { const b = cv.getBoundingClientRect(); s.ptr.x = (e.clientX - b.left) / b.width * W; s.ptr.y = (e.clientY - b.top) / b.height * H; s.ptr.on = true; s.dirty = true; });
  cv.addEventListener("pointerleave", () => { s.ptr.on = false; s.dirty = true; });
  new IntersectionObserver(([e]) => { s.visible = e.isIntersecting; }).observe(cv);
  return s;
});

const t0 = performance.now();
let frozenAt = 0;
function frame(now) {
  const t = live.on ? (now - t0) / 1000 : frozenAt;
  for (const s of sheets) {
    if (!s.visible || (!live.on && !s.dirty)) continue;
    const k = s.cv.width / W;
    s.g.setTransform(k, 0, 0, k, 0, 0);
    s.g.fillStyle = s.p.theme.p; s.g.fillRect(0, 0, W, H);
    try { DRAW[s.p.id](s.g, t, s.ptr, s.p.theme); } catch (e) { console.error(s.p.id, e); }
    s.dirty = false;
  }
  requestAnimationFrame(frame);
}
const btn = document.getElementById("motion");
const label = () => { btn.textContent = live.on ? "Hold still" : "Bring to life"; btn.setAttribute("aria-pressed", String(live.on)); };
btn.addEventListener("click", () => { if (live.on) frozenAt = (performance.now() - t0) / 1000; live.on = !live.on; sheets.forEach((s) => (s.dirty = true)); label(); });
label();
window.__still = () => { live.on = false; frozenAt = 0; sheets.forEach((s) => (s.dirty = true)); };
document.fonts.ready.then(() => Promise.all([`400 12px ${MONO}`, `700 12px ${MONO}`, `800 40px ${DISPLAY}`, `400 40px ${SERIF}`].map((f) => document.fonts.load(f)))).finally(() => { vyoMask = null; sheets.forEach((s) => (s.dirty = true)); requestAnimationFrame(frame); });
</script>
