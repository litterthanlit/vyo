<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vyo — Editorial Poster Grammars</title>
  <style>
    :root {
      --bg: #111215;
      --surface: #181a1f;
      --border: #2a2d35;
      --text: #eceef2;
      --muted: #9399a6;
      --accent: #c8232c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 18, 21, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab:hover { color: var(--text); border-color: #454a57; }
    .tab.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .tab.new-pill {
      border-color: rgba(200, 35, 44, 0.65);
    }
    .tab.new-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #444956;
    }
    .frame {
      background: #0b0c0e;
      cursor: zoom-in;
      aspect-ratio: 840 / 1190;
      overflow: hidden;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .meta {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-size: 14px; font-weight: 600; }
    .badge {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .badge.fusion {
      color: #ff8e94;
      border-color: rgba(200, 35, 44, 0.5);
      background: rgba(200, 35, 44, 0.12);
    }
    .desc { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 11, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 94vw;
      max-height: 92vh;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
    }
    .lightbox-cap {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 26, 31, 0.92);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>vyo — Editorial Poster Grammars</h1>
      <div class="sub">Real codebase scans (vyo, Flask, Pantry) · Click any poster to inspect full size</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab new-pill active" data-filter="fusion">1 + 3 Fusion (4)</button>
      <button class="tab" data-filter="all">All (10)</button>
      <button class="tab" data-filter="mosaic">a-mosaic (2)</button>
      <button class="tab" data-filter="cascade">b-cascade (2)</button>
      <button class="tab" data-filter="strata">c-strata (2)</button>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <div class="lightbox" id="lightbox">
    <img id="lb-img" alt="" />
    <div class="lightbox-cap" id="lb-cap"></div>
  </div>
  <script>
    const POSTERS = [
      {
        group: "fusion",
        tag: "d-mosaic-strata",
        fusion: true,
        title: "vyo — Obsidian Signal Mosaic",
        desc: "71 files · 12,559 lines · 228 imports. Refracted horizontal strata quantized to a 7px dot/square lattice on pitch black with sparse plain-language micro-type.",
        src: "img/vyo-signal-mosaic.jpg"
      },
      {
        group: "fusion",
        tag: "d-mosaic-strata",
        fusion: true,
        title: "Flask — Obsidian Signal Mosaic",
        desc: "36 files · 8,068 lines · 94 imports. Broader glacial strata from Flask's larger core modules rendered through the 7px mosaic + sparse micro-type lattice.",
        src: "img/flask-signal-mosaic.jpg"
      },
      {
        group: "fusion",
        tag: "d-mosaic-strata",
        fusion: true,
        title: "vyo — Obsidian Refracted Bloom",
        desc: "71 files · 12,559 lines. Organic branching bloom sliced and refracted through codebase import strata on obsidian, quantized into glowing 7px mosaic cells.",
        src: "img/vyo-bloom-strata.jpg"
      },
      {
        group: "fusion",
        tag: "d-mosaic-strata",
        fusion: true,
        title: "vyo — Daylight Strata Mosaic",
        desc: "71 files · 12,559 lines. Cool alabaster paper, slate + mist + crimson palette, clean Inter grotesque type, and stepped horizontal strata — zero flowers needed.",
        src: "img/vyo-daylight-strata.jpg"
      },
      {
        group: "mosaic",
        tag: "a-mosaic",
        title: "vyo — Dot-Mosaic Bloom",
        desc: "71 files · 12,559 lines · 228 imports. Crimson bloom marks the drawing engine (tools/lib/fields); sparse plain-language choices woven across the 7px grid.",
        src: "img/vyo-mosaic.jpg"
      },
      {
        group: "mosaic",
        tag: "a-mosaic",
        title: "Flask — Dot-Mosaic Bloom",
        desc: "36 files · 8,068 lines · 94 imports. Single-origin stem unfurling outward; crimson bloom marks the request & app core.",
        src: "img/flask-mosaic.jpg"
      },
      {
        group: "cascade",
        tag: "b-cascade",
        title: "vyo — Translucent Cascade",
        desc: "71 files · 12,559 lines · 1,207 multiply-blended vertical shards with risograph ink grain. Charcoal spine: fields · indigo: engine · rose: scan · saffron: CLI & covers.",
        src: "img/vyo-cascade.jpg"
      },
      {
        group: "cascade",
        tag: "b-cascade",
        title: "Pantry — Translucent Cascade",
        desc: "41 files · 593 lines · 60 imports. East Asian risograph palette (sumi, mineral jade, persimmon coral, gingko ochre) on warm archival paper.",
        src: "img/pantry-cascade.jpg"
      },
      {
        group: "strata",
        tag: "c-strata",
        title: "vyo — Chromatic Strata",
        desc: "71 files · 12,559 lines · 93 horizontal slices. Fine fracture rhythm from 71 small modules; drawing engine ignites the upper-right focal flare.",
        src: "img/vyo-strata.jpg"
      },
      {
        group: "strata",
        tag: "c-strata",
        title: "Flask — Chromatic Strata",
        desc: "36 files · 8,068 lines · 52 horizontal slices. Broader glacial strata from larger modules; request core drives the upper-right refraction.",
        src: "img/flask-strata.jpg"
      }
    ];

    const grid = document.getElementById("grid");
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbCap = document.getElementById("lb-cap");

    function render(filter) {
      grid.innerHTML = "";
      POSTERS.filter(p => filter === "all" || p.group === filter).forEach(p => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="frame"><img src="${p.src}" alt="${p.title}" loading="lazy" /></div>
          <div class="meta">
            <div class="row">
              <span class="title">${p.title}</span>
              <span class="badge ${p.fusion ? "fusion" : ""}">${p.tag}</span>
            </div>
            <div class="desc">${p.desc}</div>
          </div>
        `;
        card.querySelector(".frame").addEventListener("click", () => {
          lbImg.src = p.src;
          lbCap.textContent = `${p.title} (${p.tag}) — click anywhere or press Esc to close`;
          lb.classList.add("open");
        });
        grid.appendChild(card);
      });
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(btn.dataset.filter);
      });
    });
    lb.addEventListener("click", () => lb.classList.remove("open"));
    window.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open"); });

    render("fusion");
  </script>
</body>
</html>
