[project]
name = "app"
version = "0.1.0"
description = "Items service: FastAPI + SQLModel + Celery"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "sqlmodel>=0.0.21,<1.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "celery>=5.4.0,<6.0.0",
    "emails>=0.6,<1.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
]

[tool.setuptools]
packages = ["app"]
